{% extends "base.html" %}

{% block title %}Reports - Library Management System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Reports Module</h1>
</div>

<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5><i class="bi bi-list-ul"></i> Master Lists</h5>
            </div>
            <div class="card-body">
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action" onclick="loadReport('books')">
                        <i class="bi bi-book"></i> Master List of Books
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" onclick="loadReport('movies')">
                        <i class="bi bi-film"></i> Master List of Movies
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" onclick="loadReport('memberships')">
                        <i class="bi bi-people"></i> Master List of Memberships
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5><i class="bi bi-graph-up"></i> Transaction Reports</h5>
            </div>
            <div class="card-body">
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action" onclick="loadReport('active-issues')">
                        <i class="bi bi-bookmark-check"></i> Active Issues
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" onclick="loadReport('overdue-returns')">
                        <i class="bi bi-exclamation-triangle"></i> Overdue Returns
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" onclick="loadReport('issue-requests')">
                        <i class="bi bi-clock-history"></i> Issue Requests
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="reportContainer" class="mt-4">
    <!-- Reports will be loaded here -->
</div>

<script>
async function loadReport(reportType) {
    const container = document.getElementById('reportContainer');
    container.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"></div><p class="mt-2">Loading report...</p></div>';
    
    try {
        let endpoint = '';
        let title = '';
        let columns = [];
        
        switch(reportType) {
            case 'books':
                endpoint = '/api/reports/books';
                title = 'Master List of Books';
                columns = ['Serial No', 'Name of Book', 'Author Name', 'Category', 'Status', 'Cost', 'Procurement Date', 'Available Copies'];
                break;
            case 'movies':
                endpoint = '/api/reports/movies';
                title = 'Master List of Movies';
                columns = ['Serial No', 'Name of Movie', 'Author Name', 'Category', 'Status', 'Cost', 'Procurement Date', 'Available Copies'];
                break;
            case 'memberships':
                endpoint = '/api/reports/memberships';
                title = 'Master List of Memberships';
                columns = ['Membership ID', 'Name of Member', 'Contact Number', 'Contact Address', 'Aadhar Card No', 'Start Date', 'End Date', 'Status', 'Amount Pending'];
                break;
            case 'active-issues':
                endpoint = '/api/reports/active-issues';
                title = 'Active Issues';
                columns = ['Serial No', 'Name of Book/Movie', 'Membership ID', 'Member Name', 'Date of Issue', 'Date of Return'];
                break;
            case 'overdue-returns':
                endpoint = '/api/reports/overdue-returns';
                title = 'Overdue Returns';
                columns = ['Serial No', 'Name of Book', 'Membership ID', 'Date of Issue', 'Date of Return', 'Fine Amount'];
                break;
            case 'issue-requests':
                endpoint = '/api/reports/issue-requests';
                title = 'Issue Requests';
                columns = ['Membership ID', 'Name of Book/Movie', 'Requested Date', 'Request Fulfilled Date', 'Status'];
                break;
        }
        
        const response = await fetch(endpoint);
        if (response.ok) {
            const data = await response.json();
            displayReport(data, title, columns);
        } else {
            container.innerHTML = '<div class="alert alert-danger">Error loading report</div>';
        }
    } catch (error) {
        container.innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
    }
}

function displayReport(data, title, columns) {
    const container = document.getElementById('reportContainer');
    
    if (data.length === 0) {
        container.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <h5>${title}</h5>
                </div>
                <div class="card-body">
                    <p class="text-center text-muted">No data available</p>
                </div>
            </div>
        `;
        return;
    }
    
    let tableHTML = `
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5>${title}</h5>
                <button class="btn btn-sm btn-outline-primary" onclick="exportToExcel('${title}')">
                    <i class="bi bi-download"></i> Export
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-hover" id="reportTable">
                        <thead class="table-dark">
                            <tr>
    `;
    
    // Add column headers
    columns.forEach(column => {
        tableHTML += `<th>${column}</th>`;
    });
    
    tableHTML += `
                            </tr>
                        </thead>
                        <tbody>
    `;
    
    // Add data rows
    data.forEach(row => {
        tableHTML += '<tr>';
        Object.values(row).forEach(value => {
            tableHTML += `<td>${value || ''}</td>`;
        });
        tableHTML += '</tr>';
    });
    
    tableHTML += `
                        </tbody>
                    </table>
                </div>
                <div class="mt-3">
                    <small class="text-muted">Total records: ${data.length}</small>
                </div>
            </div>
        </div>
    `;
    
    container.innerHTML = tableHTML;
}

function exportToExcel(title) {
    const table = document.getElementById('reportTable');
    if (!table) return;
    
    let csv = [];
    const rows = table.querySelectorAll('tr');
    
    for (let i = 0; i < rows.length; i++) {
        const row = [], cols = rows[i].querySelectorAll('td, th');
        
        for (let j = 0; j < cols.length; j++) {
            row.push(cols[j].innerText);
        }
        
        csv.push(row.join(','));
    }
    
    // Download CSV file
    const csvString = csv.join('\n');
    const blob = new Blob([csvString], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    
    a.setAttribute('hidden', '');
    a.setAttribute('href', url);
    a.setAttribute('download', `${title.replace(/\s+/g, '_')}.csv`);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// Load default report
document.addEventListener('DOMContentLoaded', function() {
    loadReport('books');
});
</script>
{% endblock %}
